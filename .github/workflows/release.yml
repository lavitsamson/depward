# Publishes with npm trusted publishing (OIDC); provenance is attached automatically.
# Docs: https://docs.npmjs.com/trusted-publishers and https://pnpm.io/cli/publish
# Each package must be configured as a trusted publisher on npmjs.com for this workflow,
# and its package.json `repository.url` must exactly match this GitHub repository.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Off until npm trusted publishing is configured for every package. Enable with the
    # repository variable RELEASE_ENABLED=true (Settings → Secrets and variables → Actions).
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # version-bump commits and tags
      pull-requests: write # the "Version Packages" PR
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # Pushes version commits through the GitHub API (the default), so checkout does
        # not need to persist credentials.
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
